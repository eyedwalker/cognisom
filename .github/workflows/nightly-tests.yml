name: Nightly Full Test Suite

# The push-triggered gate in deploy.yml runs `-m "not slow"` so it stays fast
# enough to block a deploy. This job runs everything, including the ~8 min
# end-to-end VCF closed-loop test, and reports failures without gating.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The same three steps as the push gate in deploy.yml, and for the
      # same reason. This job had none of them, so it ran the whole suite
      # under the PWM approximation -- 20,700 "MHCflurry failed to load"
      # warnings a night -- while the slow tests' pinned outcomes are
      # measured with the real predictor, the one production ships. It was
      # red every night from at least 2026-10-12 to 2026-11-10 and, because
      # it reports without gating, nothing said so.
      - name: Cache MHCflurry models
        id: mhcflurry-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mhcflurry
          key: mhcflurry-models-2.0.6-class1-presentation

      - name: Fetch MHCflurry models
        if: steps.mhcflurry-cache.outputs.cache-hit != 'true'
        run: mhcflurry-downloads fetch models_class1_presentation

      - name: Verify MHCflurry is usable (not the PWM fallback)
        run: |
          python -c "
          from mhcflurry import Class1PresentationPredictor
          p = Class1PresentationPredictor.load()
          assert p.supported_alleles, 'loaded but no alleles'
          print(f'MHCflurry usable: {len(p.supported_alleles)} alleles')
          "

      - name: Run full suite (both trees, including slow tests)
        run: python -m pytest --tb=short -q --durations=20

  # ── The older OpenUSD ──────────────────────────────────────────────
  # requirements.txt pins usd-core 26.11 (since 2026-10-27), which the job
  # above tests and which production installs. This job pins the OLD one,
  # 25.11, because Bio-USD is published for other people to use and some of
  # them will be on an older OpenUSD: there, registering validators from
  # Python (26.05, PR #4015) and UsdProfiles (26.08) do not exist, and the
  # package must say so rather than imply its checks ran. Those guards are
  # only exercised here. Runs the USD-touching files, the one list
  # scripts/usd_matrix.sh holds (it runs the same files locally under both
  # versions). Reports, does not gate, like the job above.
  usd-25:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install usd-core 25.11 under the 26.11 pin
        run: |
          pip install usd-core==25.11
          python -c "
          from pxr import Usd
          v = Usd.GetVersion()
          assert v[:2] == (0, 25), f'expected usd-core 25.x, pxr reports {v}'
          print('usd-core', '.'.join(map(str, v[1:])))
          "

      - name: Run the USD tests on usd-core 25.11
        run: |
          files="$(bash scripts/usd_matrix.sh --list)"
          test -n "$files"
          python -m pytest --tb=short -q -p no:cacheprovider $files
