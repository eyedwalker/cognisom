# The standalone package, for the extracted repository. Inside Cognisom
# this directory is imported as `cognisom.biousd.standard` and this file
# is not used; after `git subtree split --prefix=cognisom/biousd/standard`
# and renaming the directory to `biousd`, it is the package.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biousd"
version = "0.1.2"
description = "Biological cells on OpenUSD: a primvar convention any OpenUSD tool reads, with a Cell Ontology term per cell"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "usd-core>=24.0",
]

[project.optional-dependencies]
# Reading PhysiCell / MultiCellDS snapshots needs scipy for the MATLAB v4 matrices.
physicell = ["scipy>=1.10"]

keywords = ["OpenUSD", "USD", "Cell Ontology", "cells", "visualization", "digital twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
biousd-validate = "biousd.validate:main"
biousd-from-physicell = "biousd.physicell:main"

[tool.setuptools]
# After extraction this directory IS the package: its files sit at the
# repository root, so the `biousd` package is mapped to ".". A clone named
# `biousd` therefore imports as `biousd` from its parent directory, and
# `pip install .` installs it the same way.
packages = ["biousd"]
package-dir = { biousd = "." }
