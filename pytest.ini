[pytest]
# Both `tests/` and `cognisom/tests/` contain files with identical basenames
# (test_ode_solver.py, test_registry.py, ...). Under pytest's default "prepend"
# import mode those collide with "import file mismatch" and the second suite
# cannot be collected at all. importlib mode gives each file its own module
# identity.
#
# A hung test would otherwise block the entire run: test_vcf_round_trip alone
# is ~8 min, and a genuinely stuck test never returns. 120s per test converts
# those into fast, named failures.
addopts = --import-mode=importlib
timeout = 120

# `cognisom/tests/` has been deleted: it was a stale near-duplicate of this
# suite (502 test functions vs 535) and the two shared one process-wide
# RegistryManager singleton, so duplicated test bodies registered the same
# names twice. There is now exactly one suite.
testpaths =
    tests

# Long-running integration tests. CI runs `-m "not slow"` on push and the
# full suite nightly.
markers =
    slow: test takes more than ~30s; excluded from the fast CI lane

asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:mhcflurry.*
