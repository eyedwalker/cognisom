[pytest]
# Both `tests/` and `cognisom/tests/` contain files with identical basenames
# (test_ode_solver.py, test_registry.py, ...). Under pytest's default "prepend"
# import mode those collide with "import file mismatch" and the second suite
# cannot be collected at all. importlib mode gives each file its own module
# identity.
#
# A hung test would otherwise block the entire run: test_vcf_round_trip alone
# is ~8 min, and a genuinely stuck test never returns. 120s per test converts
# those into fast, named failures.
addopts = --import-mode=importlib
timeout = 120

# Only the root suite runs by default. `cognisom/tests/` is a near-duplicate
# of this tree, and the two share one process-wide RegistryManager singleton:
# duplicated test bodies register the same names twice and the second copy
# fails with DuplicateRegistrationError. That is a symptom of the duplicate
# source tree, not of the tests, and the fix is to collapse the trees rather
# than to paper over it with a registry-resetting fixture.
#
# `tests/` is the suite to keep: it carries the 2026 upgrade coverage
# (exhaustion, TME classification, closed-loop neoantigen, memory
# architecture) that `cognisom/tests/` lacks entirely.
testpaths =
    tests

# Long-running integration tests. CI runs `-m "not slow"` on push and the
# full suite nightly.
markers =
    slow: test takes more than ~30s; excluded from the fast CI lane

asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:mhcflurry.*
